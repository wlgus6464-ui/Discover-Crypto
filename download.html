<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Download — Trader's Notes</title>
  <meta name="theme-color" content="#050506" />
  <link rel="icon" href="./assets/profile.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="app download-page">
    <a class="back-link" href="./index.html">← Back</a>

    <section class="download-card">
      <svg class="zip-logo" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="zipBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFD54A"/>
            <stop offset="100%" stop-color="#F5A623"/>
          </linearGradient>
        </defs>
        <rect x="16" y="14" width="64" height="68" rx="12" fill="url(#zipBody)"/>
        <rect x="16" y="14" width="64" height="18" rx="12" fill="#FFCC33"/>
        <rect x="16" y="24" width="64" height="8" fill="#FFCC33"/>
        <rect x="44" y="10" width="8" height="12" rx="2" fill="#3F3F46"/>
        <rect x="45.5" y="22" width="5" height="8" rx="1" fill="#71717A"/>
        <rect x="44" y="30" width="8" height="7" rx="1.5" fill="#3F3F46"/>
        <rect x="45.5" y="37" width="5" height="8" rx="1" fill="#71717A"/>
        <rect x="44" y="45" width="8" height="7" rx="1.5" fill="#3F3F46"/>
        <rect x="45.5" y="52" width="5" height="8" rx="1" fill="#71717A"/>
        <rect x="44" y="60" width="8" height="10" rx="2" fill="#27272A"/>
        <circle cx="48" cy="65" r="2.2" fill="#F4F4F5"/>
        <text x="48" y="80" text-anchor="middle" font-size="11" font-weight="800" font-family="Inter, Arial" fill="#3F2A00">ZIP</text>
      </svg>

      <h1>Trader's Notes - It’s being distributed for free only during this period!</h1>
      <div class="file-name">AI Search Program for BINANCE and 100 Exchanges.zip</div>

      <button class="download-btn" id="downloadBtn" type="button">Download</button>

      <form class="password-box" id="passwordBox" hidden>
        <label for="filePassword">Password</label>
        <input id="filePassword" type="password" name="password" autocomplete="current-password" placeholder="Password" required />
        <button class="download-btn" type="submit">Confirm</button>
      </form>

      <a id="realDownload" href="./files/AI%20Search%20Program%20for%20BINANCE%20and%20100%20Exchanges.zip" download="AI Search Program for BINANCE and 100 Exchanges.zip" hidden></a>
      <p class="download-note">It is distributed for free only during this period!</p>
    </section>
  </main>
  <script>
    const downloadBtn = document.getElementById("downloadBtn");
    const passwordBox = document.getElementById("passwordBox");
    const passwordInput = document.getElementById("filePassword");
    const realDownload = document.getElementById("realDownload");

    downloadBtn.addEventListener("click", () => {
      passwordBox.hidden = false;
      passwordInput.focus();
    });

    const fillMessage = "Please fill out this input field";
    passwordInput.addEventListener("invalid", () => {
      passwordInput.setCustomValidity(fillMessage);
    });
    passwordInput.addEventListener("input", () => {
      passwordInput.setCustomValidity("");
    });

    passwordBox.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!passwordInput.value.trim()) {
        passwordInput.setCustomValidity(fillMessage);
        passwordInput.reportValidity();
        return;
      }
      realDownload.click();
    });
  </script>
</body>
</html>
